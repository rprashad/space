set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard off
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
if-shell 'test -x /bin/zsh' 'set -g default-shell /bin/zsh'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'Configuration reloaded'
bind ] run-shell '"$HOME/.local/bin/tmux-paste-clipboard" "#{pane_id}"'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '"$HOME/.local/bin/clipboard-copy"'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '"$HOME/.local/bin/clipboard-copy"'
set -g status-style 'bg=#293b53,fg=#f3f6fc'
set -g pane-border-style 'fg=#a9bbd3'
set -g pane-active-border-style 'fg=#ffe1a3'
setw -g window-status-style 'fg=#dbe4f1,bg=#293b53'
setw -g window-status-current-style 'fg=#203149,bg=#b9d8ff,bold'
setw -g mode-style 'fg=#203149,bg=#b9d8ff'
set -g message-style 'fg=#203149,bg=#ffe1a3'
set -g status-left '#[bg=#b9d8ff,fg=#203149,bold] #S #[default] '
set -g status-right '#[fg=#c4f5ef] #{pane_current_path} #[fg=#dbe4f1]| %a %H:%M '
set -g status-right-length 70
set -g status-interval 15

# Explicit defaults let terminal apps detect the navy background in tmux.
set -g window-style 'fg=#f3f6fc,bg=#34465f'

# Keep graphical clipboard endpoints current when reattaching.
set -ag update-environment ' WAYLAND_DISPLAY XDG_RUNTIME_DIR'
# Platform bindings live outside the portable defaults.
if-shell 'test -r "$HOME/.config/space/tmux-platform.conf"' 'source-file ~/.config/space/tmux-platform.conf'
